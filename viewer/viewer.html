<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>QR code result</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #003c3d;
      background: #eef7f7;
    }
    .card {
      width: 420px;
      max-width: calc(100vw - 32px);
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0, 45, 46, 0.15);
      overflow: hidden;
    }
    .top {
      padding: 12px 16px;
      background: linear-gradient(120deg, #007173, #15803d);
      color: #fff;
      font-weight: 600;
      font-size: 13px;
    }
    .body { padding: 16px; }
    .chip {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      color: #15803d;
      background: rgba(34, 197, 94, 0.14);
      border-radius: 999px;
      padding: 2px 9px;
      margin-bottom: 8px;
    }
    .raw {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      background: #eef7f7;
      border-radius: 8px;
      padding: 8px 10px;
      max-height: 200px;
      overflow: auto;
      word-break: break-all;
      white-space: pre-wrap;
      user-select: all;
    }
    .fields { margin: 8px 0 0; padding: 0; list-style: none; }
    .fields li { display: flex; gap: 8px; margin-top: 4px; font-size: 12.5px; }
    .fields .k { color: #527273; flex: none; min-width: 70px; }
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn {
      all: unset;
      cursor: pointer;
      flex: 1;
      text-align: center;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      background: #e3f2f2;
      box-sizing: border-box;
    }
    .btn.primary { background: linear-gradient(120deg, #007173, #15803d); color: #fff; }
    .hint { color: #527273; font-size: 12.5px; margin-top: 6px; }
    .foot {
      padding: 9px 16px;
      border-top: 1px solid #dff0f0;
      font-size: 11.5px;
      color: #527273;
      display: flex;
      justify-content: space-between;
    }
    .foot a { color: #007173; text-decoration: none; }
    @media (prefers-color-scheme: dark) {
      body { background: #001a1b; color: #e6f7f7; }
      .card { background: #003c3d; }
      .raw { background: #002021; }
      .btn { background: #0b4f50; color: #e6f7f7; }
      .fields .k, .hint, .foot { color: #8fc0c0; }
      .foot { border-top-color: #0b4f50; }
      .chip { color: #86efac; background: rgba(34, 197, 94, 0.18); }
      .foot a { color: #4ce3e6; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">QR code result</div>
    <div class="body" id="body"></div>
    <div class="foot"><span>Decoded on your device</span>
      <a href="https://qrgenie.app" target="_blank" rel="noopener">Made by QRGenie</a></div>
  </div>
  <script src="viewer.js"></script>
</body>
</html>
